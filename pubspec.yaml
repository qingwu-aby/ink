name: mopu
description: "墨谱 · 小说写作知识图谱 — 正文与图谱双向绑定的长篇小说写作台"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.2.0
  file_picker: ^13.0.0
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqlite3: ^2.4.6
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
